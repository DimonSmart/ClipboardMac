name: Publish macOS release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        env:
          VERSION: ${{ github.ref_name }}
          UNIVERSAL: '1'
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          VERSION="${VERSION#v}" Scripts/build-app.sh
          ditto -c -k --sequesterRsrc --keepParent dist/ClipboardMac.app dist/ClipboardMac-macos.zip
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/ClipboardMac-macos.zip --title "$GITHUB_REF_NAME" --generate-notes
